<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>WINK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#faf8f5;color:#0f172a;font-size:16px;line-height:1.4;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;border:none;outline:none;background:none}
button{cursor:pointer}

.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;padding-bottom:env(safe-area-inset-bottom)}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}

/* ─── 헤더 ─── */
.hdr{padding:18px 22px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#faf8f5;position:sticky;top:0;z-index:10}
.hdr-back{font-size:24px;color:#0f172a;padding:6px 10px 6px 0;margin-left:-10px;font-weight:300}
.hdr-title{font-size:20px;font-weight:800;letter-spacing:-.5px}
.hdr-sub{font-size:12.5px;color:#94a3b8;font-weight:700;margin-top:2px}
.hdr-right{font-size:13px;color:#94a3b8;font-weight:700;padding:6px 10px}

/* ═════════ Screen 1: 로그인 ═════════ */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 32px;min-height:100vh;background:#faf8f5}
.login-brand{text-align:center;margin-bottom:56px}
.login-logo{width:80px;height:80px;background:#0f172a;border-radius:24px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;color:#fbbf24;font-size:34px;box-shadow:0 8px 24px rgba(15,23,42,.15)}
.login-name{font-size:34px;font-weight:900;letter-spacing:-1px;color:#0f172a;line-height:1}
.login-tag{font-size:13px;color:#94a3b8;font-weight:700;margin-top:10px;letter-spacing:.2px}
.login-form{display:flex;flex-direction:column;gap:14px}
.login-input{background:#fff;border:1.5px solid #e8e3dc;color:#0f172a;padding:18px 20px;border-radius:16px;font-size:16px;font-weight:700;transition:all .15s;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.login-input::placeholder{color:#cbd5e1;font-weight:500}
.login-input:focus{border-color:#0f172a;box-shadow:0 0 0 4px rgba(15,23,42,.06)}
.login-btn{background:#0f172a;color:#fff;padding:20px;border-radius:16px;font-size:17px;font-weight:800;letter-spacing:-.3px;margin-top:10px;transition:all .12s;box-shadow:0 4px 14px rgba(15,23,42,.18)}
.login-btn:active{transform:scale(.98)}
.login-btn:disabled{background:#cbd5e1;box-shadow:none}
.login-err{background:#fef2f2;color:#dc2626;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:700;text-align:center;display:none}
.login-err.on{display:block}
.login-hint{font-size:12px;color:#cbd5e1;text-align:center;margin-top:20px;font-weight:600;line-height:1.7}

/* ═════════ Screen 2: 오늘 할 일 ═════════ */
.home-greet{padding:8px 22px 18px}
.home-hi{font-size:14px;color:#94a3b8;font-weight:700;margin-bottom:4px}
.home-cnt{font-size:30px;font-weight:900;letter-spacing:-.8px;color:#0f172a;line-height:1.1}
.home-cnt b{color:#dc2626}

.tab-bar{padding:0 22px;display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;background:#fff;border:1.5px solid #e8e3dc;color:#64748b;font-size:13px;font-weight:800;padding:10px 0;border-radius:12px;letter-spacing:-.2px}
.tab.on{background:#0f172a;color:#fff;border-color:#0f172a}

.list{flex:1;padding:0 16px 90px;display:flex;flex-direction:column;gap:10px}
.lead{background:#fff;border:1.5px solid #f0eae0;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:14px;transition:transform .12s;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.lead:active{transform:scale(.985)}
.lead-av{width:48px;height:48px;border-radius:50%;background:#fef3c7;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#92400e;flex-shrink:0}
.lead-av.urg{background:#fee2e2;color:#dc2626}
.lead-av.ok{background:#dcfce7;color:#16a34a}
.lead-mid{flex:1;min-width:0}
.lead-name{font-size:17px;font-weight:900;color:#0f172a;letter-spacing:-.3px;line-height:1.2}
.lead-reason{font-size:12.5px;color:#94a3b8;font-weight:700;margin-top:3px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-status{font-size:11px;font-weight:900;padding:5px 10px;border-radius:8px;letter-spacing:-.2px;flex-shrink:0}
.st-s{background:#dbeafe;color:#1e40af}
.st-d{background:#dcfce7;color:#166534}
.st-w{background:#fef3c7;color:#92400e}
.st-ls{background:#ede9fe;color:#6d28d9}
.st-vc{background:#cffafe;color:#0e7490}
.st-cl{background:#fae8ff;color:#86198f}
.st-none{background:#f1f5f9;color:#64748b}
.st-x{background:#fee2e2;color:#991b1b}
.lead-arrow{font-size:18px;color:#cbd5e1;flex-shrink:0;font-weight:300}

.empty{padding:60px 30px;text-align:center;color:#94a3b8;font-weight:700;font-size:14px}
.empty-ico{font-size:48px;margin-bottom:12px;opacity:.4}

/* ═════════ Screen 3: 입력 ═════════ */
.form{flex:1;padding:0 22px 120px}
.form-who{background:#fff;border-radius:20px;padding:20px 22px;margin-bottom:18px;border:1.5px solid #f0eae0;display:flex;align-items:center;gap:14px}
.form-who-av{width:54px;height:54px;border-radius:50%;background:#fef3c7;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#92400e}
.form-who-info{flex:1}
.form-who-name{font-size:20px;font-weight:900;letter-spacing:-.3px}
.form-who-sub{font-size:12px;color:#94a3b8;font-weight:700;margin-top:2px}

.section{margin-bottom:24px}
.section-h{font-size:13px;font-weight:900;color:#475569;letter-spacing:-.2px;margin-bottom:12px;padding-left:4px;display:flex;justify-content:space-between;align-items:center}
.section-h .cnt{color:#94a3b8;font-size:11.5px;font-weight:700}

/* 상태 4개 큰 버튼 */
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status-opt{background:#fff;border:2px solid #f0eae0;border-radius:16px;padding:18px 12px;font-size:14.5px;font-weight:900;color:#475569;text-align:center;letter-spacing:-.3px;transition:all .12s;display:flex;flex-direction:column;align-items:center;gap:6px}
.status-opt:active{transform:scale(.97)}
.status-opt .ico{font-size:24px}
.status-opt.on{color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.status-opt.on[data-st="d"]{background:#16a34a}
.status-opt.on[data-st="s"]{background:#1e40af}
.status-opt.on[data-st="w"]{background:#d97706}
.status-opt.on[data-st="x"]{background:#dc2626}

/* 사진 그리드 */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-add{aspect-ratio:1;background:#fff;border:2px dashed #cbd5e1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;font-size:11.5px;font-weight:800;gap:4px}
.photo-add .ico{font-size:28px;font-weight:300}
.photo-thumb{aspect-ratio:1;border-radius:14px;background-size:cover;background-position:center;position:relative;border:1.5px solid #e8e3dc}
.photo-rm{position:absolute;top:-6px;right:-6px;width:24px;height:24px;background:#0f172a;color:#fff;border-radius:50%;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* 메모 */
.memo-box{width:100%;background:#fff;border:1.5px solid #f0eae0;border-radius:16px;padding:16px 18px;font-size:15px;font-weight:600;color:#0f172a;line-height:1.55;resize:none;min-height:100px;transition:border-color .15s}
.memo-box:focus{border-color:#0f172a}
.memo-box::placeholder{color:#cbd5e1;font-weight:500}

/* 제출 바 */
.submit-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(250,248,245,0) 0%,#faf8f5 24%);padding:30px 22px calc(20px + env(safe-area-inset-bottom));z-index:40;pointer-events:none}
.submit-bar-inner{max-width:480px;margin:0 auto;pointer-events:auto}
.submit-btn{width:100%;background:#0f172a;color:#fff;padding:20px;border-radius:18px;font-size:17px;font-weight:900;letter-spacing:-.3px;transition:all .12s;box-shadow:0 8px 28px rgba(15,23,42,.25);display:flex;align-items:center;justify-content:center;gap:8px}
.submit-btn:active{transform:scale(.98)}
.submit-btn:disabled{background:#cbd5e1;color:#fff;box-shadow:none}
.submit-btn .spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 토스트 */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,23,42,.96);color:#fff;padding:22px 30px;border-radius:18px;font-size:15px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 50px rgba(0,0,0,.3);opacity:0;transition:all .22s;pointer-events:none;z-index:200;max-width:80%}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast .ico{font-size:24px}

/* 로딩 */
.loading{position:fixed;inset:0;background:rgba(250,248,245,.85);display:none;align-items:center;justify-content:center;z-index:150;backdrop-filter:blur(6px)}
.loading.on{display:flex}
.loading-spin{width:48px;height:48px;border:4px solid #e8e3dc;border-top-color:#0f172a;border-radius:50%;animation:spin .7s linear infinite}

/* 설정 모달 */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;z-index:180;backdrop-filter:blur(4px)}
.modal.on{display:flex}
.modal-card{background:#faf8f5;width:100%;max-width:480px;margin:0 auto;border-radius:24px 24px 0 0;padding:28px 24px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
.modal-h{font-size:18px;font-weight:900;margin-bottom:6px;letter-spacing:-.4px}
.modal-sub{font-size:12.5px;color:#94a3b8;font-weight:700;margin-bottom:18px;line-height:1.5}
.modal-input{width:100%;background:#fff;border:1.5px solid #e8e3dc;padding:14px 16px;border-radius:12px;font-size:13.5px;font-weight:600;color:#0f172a;margin-bottom:14px;word-break:break-all}
.modal-btns{display:flex;gap:10px;margin-top:8px}
.modal-btn{flex:1;padding:15px;border-radius:14px;font-size:14.5px;font-weight:800;letter-spacing:-.2px}
.modal-btn.pri{background:#0f172a;color:#fff}
.modal-btn.sec{background:#fff;border:1.5px solid #e8e3dc;color:#475569}
</style>
</head>
<body>

<!-- 🔧 환경설정: WEBHOOK_URL은 첫 사용 시 화면에서 입력하거나 여기에 하드코딩 -->

<div class="app">

<!-- ════════ Screen 1: 로그인 ════════ -->
<div class="screen on" id="s-login">
  <div class="login">
    <div class="login-brand">
      <div class="login-logo">🔥</div>
      <div class="login-name">WINK</div>
      <div class="login-tag">에이전트 · Agent</div>
    </div>
    <div class="login-form">
      <div class="login-err" id="login-err"></div>
      <input class="login-input" id="i-name" placeholder="이름 / Nama" autocomplete="off" autocapitalize="off">
      <input class="login-input" id="i-pin" type="tel" inputmode="numeric" maxlength="6" placeholder="PIN">
      <button class="login-btn" id="login-btn" onclick="login()">시작하기</button>
      <div class="login-hint" id="login-hint">PIN은 관리자에게 받으세요</div>
    </div>
    <div style="position:absolute;top:20px;right:20px">
      <button onclick="openSettings()" style="font-size:20px;color:#cbd5e1;padding:8px">⚙</button>
    </div>
  </div>
</div>

<!-- ════════ Screen 2: 오늘 할 일 ════════ -->
<div class="screen" id="s-home">
  <div class="hdr">
    <div>
      <div class="hdr-title" id="h-greet">안녕하세요</div>
      <div class="hdr-sub" id="h-date">—</div>
    </div>
    <button class="hdr-right" onclick="logout()">로그아웃</button>
  </div>

  <div class="home-greet">
    <div class="home-hi">오늘 할 일</div>
    <div class="home-cnt"><b id="h-todo-cnt">0</b>건 남았어요</div>
  </div>

  <div class="tab-bar">
    <button class="tab on" data-tab="today" onclick="switchTab(this)">📅 오늘</button>
    <button class="tab" data-tab="urgent" onclick="switchTab(this)">🔴 긴급</button>
    <button class="tab" data-tab="all" onclick="switchTab(this)">전체</button>
  </div>

  <div class="list" id="lead-list"></div>
</div>

<!-- ════════ Screen 3: 방문 입력 ════════ -->
<div class="screen" id="s-form">
  <div class="hdr">
    <button class="hdr-back" onclick="goHome()">←</button>
    <div style="flex:1">
      <div class="hdr-title">방문 결과</div>
      <div class="hdr-sub">한 화면에서 끝</div>
    </div>
  </div>

  <div class="form">
    <!-- 회원 정보 -->
    <div class="form-who">
      <div class="form-who-av" id="f-av">?</div>
      <div class="form-who-info">
        <div class="form-who-name" id="f-name">—</div>
        <div class="form-who-sub" id="f-sub">—</div>
      </div>
    </div>

    <!-- 결과 (상태) -->
    <div class="section">
      <div class="section-h">결과는요?</div>
      <div class="status-grid">
        <button class="status-opt" data-st="d" onclick="pickStatus(this)"><span class="ico">✅</span><span>방문완료</span></button>
        <button class="status-opt" data-st="s" onclick="pickStatus(this)"><span class="ico">📅</span><span>방문예약</span></button>
        <button class="status-opt" data-st="w" onclick="pickStatus(this)"><span class="ico">⏳</span><span>일정대기</span></button>
        <button class="status-opt" data-st="x" onclick="pickStatus(this)"><span class="ico">❌</span><span>취소/거절</span></button>
      </div>
    </div>

    <!-- 사진 -->
    <div class="section">
      <div class="section-h">사진 <span class="cnt" id="ph-cnt">0 / 5</span></div>
      <div class="photos" id="photos">
        <label class="photo-add" for="photo-input">
          <span class="ico">+</span><span>사진</span>
        </label>
      </div>
      <input type="file" id="photo-input" accept="image/*" multiple capture="environment" style="display:none" onchange="addPhotos(this.files)">
    </div>

    <!-- 메모 -->
    <div class="section">
      <div class="section-h">메모 (선택)</div>
      <textarea class="memo-box" id="memo-input" placeholder="한 줄로 짧게 적어도 좋아요"></textarea>
    </div>
  </div>

  <div class="submit-bar">
    <div class="submit-bar-inner">
      <button class="submit-btn" id="submit-btn" onclick="submitVisit()">
        <span id="sb-ico">💾</span>
        <span id="sb-txt">제출하기</span>
      </button>
    </div>
  </div>
</div>

<!-- 토스트 / 로딩 / 모달 -->
<div class="toast" id="toast"><span class="ico" id="t-ico">✅</span><span id="t-msg">—</span></div>
<div class="loading" id="loading"><div class="loading-spin"></div></div>

<div class="modal" id="settings-modal">
  <div class="modal-card">
    <div class="modal-h">⚙ 서버 주소 설정</div>
    <div class="modal-sub">Google Apps Script 웹앱 URL을 입력하세요.<br>관리자가 처음 한 번만 설정하면 됩니다.</div>
    <input class="modal-input" id="m-url" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="modal-btns">
      <button class="modal-btn sec" onclick="closeSettings()">취소</button>
      <button class="modal-btn pri" onclick="saveSettings()">저장</button>
    </div>
  </div>
</div>

</div><!-- /.app -->

<script>
// ═════════════════════════════════════════════
//  WINK 에이전트 앱 (테스트 버전)
// ═════════════════════════════════════════════

const APP_VERSION = '0.1.0-test';
const LS = {
  url: 'wink_url',
  session: 'wink_session',
};

let me = null;            // {name, display}
let leads = [];           // 서버에서 받은 내 리드들
let curLead = null;
let pickedStatus = null;
let photos = [];          // [{dataUrl, name}]
let curTab = 'today';

// ───── 화면 전환 ─────
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo(0,0);
}

// ───── 초기화 ─────
(function init(){
  // 저장된 세션 복구
  try {
    const sess = JSON.parse(localStorage.getItem(LS.session) || 'null');
    if(sess && sess.name){
      me = sess;
      gotoHome();
      return;
    }
  } catch(e){}
  show('s-login');
})();

// ───── 서버 통신 ─────
function getUrl(){
  return localStorage.getItem(LS.url) || '';
}
async function api(action, payload){
  const url = getUrl();
  if(!url){
    openSettings();
    throw new Error('서버 주소가 설정되지 않았어요. ⚙ 버튼으로 설정하세요.');
  }
  // GAS는 사전요청(preflight)을 안 받음 → text/plain 으로 보내야 CORS 통과
  const res = await fetch(url, {
    method:'POST',
    redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action, ...payload}),
  });
  if(!res.ok) throw new Error('서버 오류 ('+res.status+')');
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || '서버에서 거부했어요');
  return j;
}

// ───── 로그인 ─────
async function login(){
  const name = document.getElementById('i-name').value.trim();
  const pin  = document.getElementById('i-pin').value.trim();
  const err  = document.getElementById('login-err');
  err.classList.remove('on');
  if(!name || !pin){
    err.textContent = '이름과 PIN을 모두 입력해주세요';
    err.classList.add('on');
    return;
  }
  setLoading(true);
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = '확인 중...';
  try {
    const r = await api('wink:login', {name, pin});
    me = {name: r.name, display: r.display || r.name};
    localStorage.setItem(LS.session, JSON.stringify(me));
    document.getElementById('i-pin').value = '';
    await gotoHome();
  } catch(e){
    err.textContent = e.message || '로그인 실패';
    err.classList.add('on');
  } finally {
    setLoading(false);
    btn.disabled = false;
    btn.textContent = '시작하기';
  }
}
function logout(){
  if(!confirm('로그아웃 할까요?')) return;
  localStorage.removeItem(LS.session);
  me = null; leads = []; curLead = null;
  show('s-login');
}

// ───── 홈 (리드 리스트) ─────
async function gotoHome(){
  show('s-home');
  document.getElementById('h-greet').textContent = `안녕하세요, ${me.display}님`;
  document.getElementById('h-date').textContent = todayStr();
  document.getElementById('lead-list').innerHTML = `<div class="empty"><div class="empty-ico">⏳</div>리드를 불러오는 중...</div>`;
  document.getElementById('h-todo-cnt').textContent = '...';
  try {
    const r = await api('wink:leads', {agent: me.name});
    leads = r.leads || [];
    renderLeads();
  } catch(e){
    document.getElementById('lead-list').innerHTML = `<div class="empty"><div class="empty-ico">⚠️</div>${escapeHtml(e.message)}<br><br><button class="login-btn" style="padding:12px 20px;font-size:13px" onclick="gotoHome()">다시 시도</button></div>`;
    document.getElementById('h-todo-cnt').textContent = '?';
  }
}

function switchTab(btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  curTab = btn.dataset.tab;
  renderLeads();
}

function renderLeads(){
  const list = document.getElementById('lead-list');
  const today = todayKey();
  let filtered = leads.slice();
  if(curTab === 'today'){
    filtered = filtered.filter(L => L.visit === today || L.severity >= 3);
  } else if(curTab === 'urgent'){
    filtered = filtered.filter(L => L.severity >= 3);
  }
  document.getElementById('h-todo-cnt').textContent = filtered.length;

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty"><div class="empty-ico">🎉</div>${curTab==='today'?'오늘 할 일이 없어요!':curTab==='urgent'?'긴급 항목 없음':'리드가 없어요'}</div>`;
    return;
  }
  list.innerHTML = filtered.map((L,i) => {
    const avClass = L.severity>=3?'urg':L.status==='cl'?'ok':'';
    const stClass = 'st-' + (L.status || 'none');
    const stLbl = STAT_LBL[L.status] || '미진행';
    return `
      <div class="lead" onclick="openLead('${escapeAttr(L.id)}')">
        <div class="lead-av ${avClass}">${escapeHtml(L.name.charAt(0))}</div>
        <div class="lead-mid">
          <div class="lead-name">${escapeHtml(L.name)}</div>
          <div class="lead-reason">${escapeHtml(L.reason || L.sponsor || '—')}</div>
        </div>
        <div class="lead-status ${stClass}">${stLbl}</div>
        <div class="lead-arrow">›</div>
      </div>`;
  }).join('');
}

const STAT_LBL = {s:'예약',d:'방문',w:'대기',ls:'랑숭',vc:'비디오',none:'미진행',cl:'클로',x:'취소'};

// ───── 디테일/입력 ─────
function openLead(id){
  curLead = leads.find(L => String(L.id) === String(id));
  if(!curLead) return;
  pickedStatus = null;
  photos = [];
  document.getElementById('f-name').textContent = curLead.name;
  document.getElementById('f-sub').textContent =
    [curLead.sponsor ? '후원 '+curLead.sponsor : '', curLead.assigned ? '배정 '+curLead.assigned : '', curLead.visit ? '방문 '+curLead.visit : ''].filter(Boolean).join(' · ') || '—';
  document.getElementById('f-av').textContent = curLead.name.charAt(0);
  document.querySelectorAll('.status-opt').forEach(b=>b.classList.remove('on'));
  document.getElementById('memo-input').value = '';
  renderPhotos();
  show('s-form');
}

function goHome(){
  if(pickedStatus || photos.length || document.getElementById('memo-input').value.trim()){
    if(!confirm('입력 중인 내용이 있어요. 정말 돌아갈까요?')) return;
  }
  show('s-home');
}

function pickStatus(btn){
  document.querySelectorAll('.status-opt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  pickedStatus = btn.dataset.st;
}

// ───── 사진 처리 (자동 리사이즈) ─────
async function addPhotos(files){
  for(const f of files){
    if(photos.length >= 5){ toast('⚠️','사진은 최대 5장까지'); break; }
    try {
      const resized = await resizeImage(f, 1600, 0.85);
      photos.push({dataUrl: resized, name: f.name});
      renderPhotos();
    } catch(e){
      toast('⚠️','사진 처리 실패: ' + (e.message||''));
    }
  }
  document.getElementById('photo-input').value = '';
}

function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('파일 읽기 실패'));
    fr.onload = e => {
      img.onerror = () => reject(new Error('이미지 디코드 실패'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else      { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    fr.readAsDataURL(file);
  });
}

function renderPhotos(){
  const wrap = document.getElementById('photos');
  wrap.innerHTML = photos.map((p,i) =>
    `<div class="photo-thumb" style="background-image:url('${p.dataUrl}')">
       <button class="photo-rm" onclick="rmPhoto(${i})" aria-label="삭제">×</button>
     </div>`
  ).join('') + (photos.length<5
    ? `<label class="photo-add" for="photo-input"><span class="ico">+</span><span>사진</span></label>`
    : '');
  document.getElementById('ph-cnt').textContent = `${photos.length} / 5`;
}
function rmPhoto(i){ photos.splice(i,1); renderPhotos(); }

// ───── 제출 ─────
async function submitVisit(){
  const memo = document.getElementById('memo-input').value.trim();
  if(!pickedStatus && photos.length === 0 && !memo){
    toast('⚠️','결과·사진·메모 중 하나는 필요해요');
    return;
  }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  document.getElementById('sb-ico').outerHTML = '<span class="spin" id="sb-ico"></span>';
  document.getElementById('sb-txt').textContent = '제출 중...';
  try {
    const r = await api('wink:submit', {
      agent: me.name,
      lead_id: curLead.id,
      lead_name: curLead.name,
      new_status: pickedStatus || '',
      memo,
      photos: photos.map(p => p.dataUrl),
      submitted_at: new Date().toISOString(),
    });
    toast('✅', `저장됐어요! (사진 ${r.photo_count||photos.length}장)`);
    // 로컬에서 리드 상태 즉시 반영
    if(pickedStatus){
      const idx = leads.findIndex(L => String(L.id)===String(curLead.id));
      if(idx>=0) leads[idx].status = pickedStatus;
    }
    setTimeout(()=>{ show('s-home'); renderLeads(); }, 900);
  } catch(e){
    toast('⚠️', e.message || '제출 실패');
  } finally {
    btn.disabled = false;
    document.getElementById('sb-ico').outerHTML = '<span id="sb-ico">💾</span>';
    document.getElementById('sb-txt').textContent = '제출하기';
  }
}

// ───── 설정 모달 ─────
function openSettings(){
  document.getElementById('m-url').value = getUrl();
  document.getElementById('settings-modal').classList.add('on');
}
function closeSettings(){
  document.getElementById('settings-modal').classList.remove('on');
}
function saveSettings(){
  const v = document.getElementById('m-url').value.trim();
  if(!v.startsWith('https://script.google.com/')){
    if(!confirm('Google Apps Script URL이 아닌 것 같아요. 그래도 저장할까요?')) return;
  }
  localStorage.setItem(LS.url, v);
  closeSettings();
  toast('✅', '저장됐어요');
}

// ───── 유틸 ─────
function todayStr(){
  const d=new Date(), w=['일','월','화','수','목','금','토'][d.getDay()];
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} (${w})`;
}
function todayKey(){
  const d=new Date();
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
}
function pad(n){ return n<10 ? '0'+n : ''+n; }
function setLoading(b){ document.getElementById('loading').classList.toggle('on', !!b); }
function toast(ico,msg){
  const t = document.getElementById('toast');
  document.getElementById('t-ico').textContent = ico;
  document.getElementById('t-msg').textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('on'), 2000);
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s).replace(/'/g, "\\'"); }

// PIN 입력 → 엔터로 로그인
document.getElementById('i-pin').addEventListener('keydown', e => {
  if(e.key === 'Enter') login();
});
